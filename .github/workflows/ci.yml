name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies (dev, analysis, figures extras)
        run: uv sync --locked --extra dev --extra analysis --extra figures

      - name: Install CPU-only torch (train extra)
        # The lock file resolves the CUDA build of torch on Linux (several GB of
        # nvidia packages). The tests only need CPU, so swap in the CPU wheel.
        run: uv pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu --reinstall-package torch

      - name: Type check (mypy)
        run: uv run --no-sync mypy src

      - name: Run pytest
        run: uv run --no-sync pytest -q
